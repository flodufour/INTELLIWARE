# Main machine: everything except robot and vision.

services:
  mongo:
    image: mongo:4.4  # Orion-LD legacy driver does not support Mongo 5.1+
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  orion-ld:
    image: fiware/orion-ld:1.6.0
    restart: unless-stopped
    command: -dbhost mongo
    depends_on:
      - mongo
    ports:
      - "1026:1026"

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-intelliware-dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1;"']
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  interface:
    build: services/interface
    restart: unless-stopped
  agent:
    build: services/agent
    restart: unless-stopped
  mcp-twin:
    build: services/mcp-twin
    restart: unless-stopped
  mcp-knowledge-base:
    build: services/mcp-knowledge-base
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-intelliware-dev}
    depends_on:
      neo4j:
        condition: service_healthy
  mcp-robot:
    build: services/mcp-robot
    restart: unless-stopped
  simulator:
    build: services/simulator
    restart: unless-stopped

volumes:
  mongo-data:
  neo4j-data:
