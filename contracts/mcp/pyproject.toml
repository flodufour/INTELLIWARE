[project]
name = "intelliware-mcp-contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.12,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["intelliware_mcp_contracts"]

[tool.setuptools.package-dir]
intelliware_mcp_contracts = "."
